<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>mk-viewer: dynamic geometry</title>

  <body>
    <canvas id="c"></canvas>
    <div class="panel">

      <div class="row">
        <button id="play">Pause</button>

      <div class="row">
