<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>mk-viewer: stress test</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="panel">
      <h1><a href="./index.html">mk-viewer</a> / stress test</h1>
      <div class="row">
        <label title="one geometry placed n times">instanced <input id="n" type="number" min="0" step="100000" /></label>
        <label title="each with its own geometry">unique <input id="m" type="number" min="0" step="10000" /></label>
      </div>
      <div class="row">
        <label title="fraction of unique meshes that are transparent">transparent <input id="glass" type="number" min="0" max="1" step="0.05" /></label>
        <button id="build">Build</button>
        <button id="bench">Benchmark</button>
      </div>
      <div id="stats" class="stats"></div>
      <div id="errors" class="errors"></div>
      <details>
        <summary>benchmark result</summary>
        <div id="result" class="mono"></div>
      </details>
    </div>
    <script type="module" src="./stress.ts"></script>
  </body>
</html>
